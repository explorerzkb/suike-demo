<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随课 · 网页体验版</title>
<script>
// 手机上直接全屏打开体验页，不套外框
if (matchMedia('(max-width: 760px)').matches || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820)) location.replace('app.html' + location.hash);
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
<style>
:root{--ink:#3a332d;--sub:#80766c;--font:"LXGW WenKai Screen","霞鹜文楷 GB 屏幕阅读版","Kaiti SC","STKaiti","KaiTi",serif}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 42%,#f2ede4 0,#e6dfd3 62%,#d8d0c3 100%);color:var(--ink);font-family:var(--font);overflow:hidden}
header{position:fixed;left:32px;right:32px;top:22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;z-index:2}
.brand{font-size:22px}
.brand small{font-size:14px;color:var(--sub);margin-left:12px}
nav button{font:inherit;font-size:15px;color:var(--sub);background:none;border:0;border-bottom:1px solid transparent;padding:3px 0;margin-left:22px;cursor:pointer}
nav button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav a{font-size:14px;color:var(--sub);margin-left:22px}
.stage{position:fixed;inset:64px 0 44px}
.device{position:absolute;left:0;top:0;transform-origin:0 0}
.glow{position:absolute;inset:10%;filter:blur(64px);opacity:.5}
.rim{position:relative;padding:var(--rim);border-radius:var(--r);background:var(--rimbg);box-shadow:0 34px 60px -24px rgba(40,30,20,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.bezel{background:#0c0c0e;padding:var(--bezel);border-radius:calc(var(--r) - var(--rim))}
.screen{position:relative;width:var(--w);height:var(--h);border-radius:calc(var(--r) - var(--rim) - var(--bezel));overflow:hidden;background:#f3efe6}
iframe{border:0;width:100%;height:100%;display:block}
.hole{position:absolute;width:var(--hole);height:var(--hole);border-radius:50%;background:#050506;top:var(--holeTop);left:var(--holeLeft);transform:translateX(-50%);pointer-events:none}
.crease{position:absolute;top:0;bottom:0;width:16px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.035) 46%,rgba(255,255,255,.09) 56%,transparent)}
.caption{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:13.5px;color:var(--sub)}
/* Pura 90 Pro Max 橘子海：直屏、居中挖孔；中框渐变，上浅蓝、中白、下暖橘 */
.p90{--w:384px;--h:846px;--r:46px;--rim:5px;--bezel:9px;--hole:22px;--holeTop:16px;--holeLeft:50%;
  --rimbg:linear-gradient(180deg,#78acd3 0%,#a8cde5 22%,#eef0ea 46%,#f5b07a 66%,#ea7a3f 86%,#d4602b 100%)}
.p90 .glow{background:linear-gradient(180deg,#86bde0,#f1eee6 45%,#f08a4b)}
/* Mate XT2 锦紫：展开内屏 10.2 英寸，约 12.8:9，展开后是一整张纸，不画折痕（折痕线条看起来像三块拼接的接缝） */
.xt2{--w:840px;--h:590px;--r:30px;--rim:4px;--bezel:8px;--hole:16px;--holeTop:12px;--holeLeft:83.33%;
  --rimbg:linear-gradient(135deg,#2f2140 0%,#5b3f78 30%,#8d6dab 48%,#4a3264 66%,#2a1d39 100%)}
.xt2 .glow{background:linear-gradient(135deg,#5b3f78,#9a7bb8,#3a2850)}
</style>
</head>
<body>
<header>
  <div class="brand">随课<small>网页体验版 · 没听懂的那一步，接回来</small></div>
  <nav><button data-d="p90">Pura 90 Pro Max · 橘子海</button><button data-d="xt2">Mate XT2 · 锦紫（展开）</button><a href="app.html" target="_blank">全屏打开</a></nav>
</header>
<div class="stage"><div class="device" id="dev"><div class="glow"></div><div class="rim"><div class="bezel"><div class="screen" id="screen"><iframe id="app" title="随课体验页"></iframe></div></div></div></div></div>
<p class="caption">用鼠标在纸上按住，问号会变清楚；在问号上松手就是提问，拖到别处松手就取消。</p>
<script>
const dev = document.getElementById('dev'), scr = document.getElementById('screen');
document.getElementById('app').src = 'app.html' + location.hash;
function fit(){
  // 按舞台大小等比缩放，并精确居中（不依赖网格对齐，避免机身压到底部说明）
  const st = document.querySelector('.stage').getBoundingClientRect();
  const w = dev.offsetWidth, h = dev.offsetHeight;
  const s = Math.min(1, (st.width - 48) / w, (st.height - 12) / h);
  dev.style.transform = `translate(${(st.width - w * s) / 2}px, ${(st.height - h * s) / 2}px) scale(${s})`;
}
function setDevice(d){
  dev.className = 'device ' + d;
  scr.querySelectorAll('.hole,.crease').forEach(e => e.remove());
  const hole = document.createElement('div'); hole.className = 'hole'; scr.appendChild(hole);
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === d)));
  history.replaceState(null, '', '?d=' + d + location.hash);
  fit();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setDevice(b.dataset.d));
addEventListener('resize', fit);
setDevice(new URLSearchParams(location.search).get('d') === 'xt2' ? 'xt2' : 'p90');
</script>
</body>
</html>
