*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f3efe6 var(--paper) repeat-y;background-size:100vw auto;background-position:center top}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.75;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.col{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 56px) 28px calc(env(safe-area-inset-bottom) + 40px)}
[hidden]{display:none!important}

/* 首页 */
.brand{font-size:52px;line-height:1.1;margin:0 0 14px;letter-spacing:.02em}
.tag{font-size:21px;margin:0 0 38px}
.label{font-size:14px;color:var(--sub);margin:0 0 6px}
.lesson{display:block;width:100%;text-align:left;padding:12px 0 10px;border-bottom:1px solid var(--rule);font-size:18px}
.lesson small{display:block;font-size:13px;color:var(--sub);line-height:1.5}
.lesson:active{color:var(--acc)}
.howto{margin-top:34px;font-size:15px}
.fine{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:22px}
.fine b{font-weight:normal;color:var(--ink)}

/* 问号页：两层纸 */
#qpage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.under,.frost{position:absolute;inset:0}
.under{background:#f3efe6 var(--paper) repeat-y;background-size:100vw auto;background-position:center top}
.mark{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:150px;line-height:1;color:var(--ink);pointer-events:none}
.frost{-webkit-mask-image:radial-gradient(circle at var(--x,50%) var(--y,46%),transparent 0,transparent calc(var(--r,0px)*.42),#000 var(--r,0px));
        mask-image:radial-gradient(circle at var(--x,50%) var(--y,46%),transparent 0,transparent calc(var(--r,0px)*.42),#000 var(--r,0px))}
.frost .blur{position:absolute;inset:-24px;filter:blur(7px)}
.frost .blur .under{inset:24px}
.frost .tint{position:absolute;inset:0;background:rgba(249,247,241,.42)}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 42px) 28px 0;max-width:460px;margin:0 auto;pointer-events:none}
.course{font-size:22px;font-weight:bold;margin:0}
.status{font-size:13.5px;color:var(--sub);margin-top:4px;min-height:1.6em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin:0 7px 1px 1px;vertical-align:middle}
.heard{font-size:14.5px;color:var(--ink);margin-top:10px;min-height:3.4em}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(env(safe-area-inset-bottom) + 26px);max-width:460px;margin:0 auto}
.board{display:flex;gap:12px;align-items:flex-end;pointer-events:none}
.board img{width:46%;border:1px solid var(--rule);display:block}
.board span{font-size:12.5px;color:var(--sub);line-height:1.5}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:15px}
.links button{pointer-events:auto}
.toast{position:absolute;left:0;right:0;top:66%;text-align:center;font-size:14px;color:var(--sub);opacity:0;transition:opacity .25s}
.toast.on{opacity:1}

/* 答案：一张落下来的纸 */
#apage{min-height:100dvh}
.sheet{transform-origin:50% 0}
.sheet.fall{animation:fall .46s cubic-bezier(.2,.75,.25,1) both}
@keyframes fall{0%{transform:perspective(900px) rotateX(-8deg) translateY(-14px) scale(1.035);opacity:.2}
  30%{transform:perspective(900px) rotateX(-1.5deg) translateY(-2px) scale(1.008);opacity:1}
  100%{transform:none;opacity:1}}
.ahead{display:flex;justify-content:space-between;font-size:15px;color:var(--sub);border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
.guess{font-size:15px;color:var(--sub);margin:0 0 14px}
.guess b{font-weight:normal;color:var(--acc)}
.loading{font-size:15px;color:var(--sub);animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.answer{font-size:18px;line-height:1.85}
.answer p{margin:0 0 12px}
.answer ul{margin:0 0 12px;padding-left:1.2em}
.answer .katex{font-size:1.02em}
.u{opacity:0}
.u.on{opacity:1;transition:opacity .14s}
.acts{display:flex;gap:26px;margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);font-size:16px}
.acts button:active{color:var(--acc)}
.note{font-size:13px;color:var(--sub);min-height:1.5em;margin-top:8px}
.old{margin-top:26px;font-size:15px}
.oldbody{margin-top:10px;color:var(--sub);font-size:16px}
.oldbody .answer{font-size:16px}

/* 按住提问：玻璃镜片 + 琥珀卡片 */
.answer,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.u.hl,.katex.hl{background:linear-gradient(transparent 58%,rgba(214,150,60,.42) 58%,rgba(214,150,60,.42) 94%,transparent 94%)}
.b.pick{text-decoration:underline dotted rgba(150,100,45,.6);text-decoration-thickness:1.5px;text-underline-offset:5px;cursor:pointer}
.lens{position:fixed;left:0;top:0;z-index:30;pointer-events:none;overflow:hidden;contain:strict}
.lens .lv{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
.lens .lv>*{position:absolute;left:0;top:0;margin:0!important;transform-origin:0 0}
.lens .rim{position:absolute;inset:0;border-radius:inherit;opacity:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -2px 5px rgba(150,100,40,.18),inset 0 3px 10px rgba(255,255,255,.28),
             inset 1.5px 0 1px -1px rgba(255,110,60,.28),inset -1.5px 0 1px -1px rgba(60,130,255,.24)}
.lens .shade{position:absolute;inset:0;border-radius:inherit;opacity:0;box-shadow:0 10px 24px -8px rgba(90,55,20,.38),0 2px 5px rgba(90,55,20,.14)}
.card{position:fixed;z-index:20;border-radius:18px;padding:15px 20px 24px;touch-action:none;overflow:hidden;
  background:rgba(255,214,150,var(--amber,.42));-webkit-backdrop-filter:blur(var(--blur,3px)) saturate(1.08);backdrop-filter:blur(var(--blur,3px)) saturate(1.08);
  box-shadow:0 16px 32px -12px rgba(110,70,20,.30),0 2px 7px rgba(110,70,20,.10),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(150,95,30,.16),
             inset 1px 0 0 rgba(255,120,60,.10),inset -1px 0 0 rgba(60,130,255,.08)}
.card .viewport{overflow:hidden}
.card .track{display:flex;width:200%;will-change:transform}
.card .pg{width:50%;flex:none;font-size:16.5px;line-height:1.75;color:var(--ink)}
.card .pg p{margin:0 0 8px}.card .pg p:last-child{margin-bottom:0}
.card .foot{position:absolute;left:0;right:0;bottom:0;height:24px}
.card .dots{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;gap:7px}
.card .dots i{width:5px;height:5px;border-radius:50%;background:rgba(90,60,30,.22);transition:background .2s}
.card .dots i.on{background:rgba(90,60,30,.6)}
.card .aim{position:absolute;right:4px;bottom:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;opacity:.5}
.card .aim:active{opacity:.9}
.card .sweep{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 48%,transparent 66%);background-size:250% 100%;transition:opacity .2s}
.card.wait .sweep{opacity:1;animation:sweep 1.1s linear infinite}
@keyframes sweep{from{background-position:120% 0}to{background-position:-130% 0}}
.tune{position:fixed;left:8px;bottom:8px;z-index:40;background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font:12px/1.5 system-ui,sans-serif;color:#333}
.tune label{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tune input{width:120px}
</style>
</head>

function show(id){
  // 离开问号页时彻底收掉：停掉磨砂动画循环、复位半径，并用 visibility 让合成层（mask + blur + fixed）不再残留
  const inQ = id === 'qpage';
  if (!inQ) { pressing = false; target = 0; r = 0; if (raf) { cancelAnimationFrame(raf); raf = 0; } $('toast').classList.remove('on'); }
  $('qpage').style.visibility = inQ ? '' : 'hidden'; $('frost').style.display = inQ ? '' : 'none';
  if (id !== 'apage' && typeof closeAll === 'function') closeAll(); for (const k of ['home','qpage','apage']) $(k).hidden = (k !== id); window.scrollTo(0,0); }

function enterClass(i){
  clearTimers(); scene = SCENES[i];
  $('course').textContent = scene.course;
  $('boardimg').src = scene.image;
  $('heard').textContent = '';
  show('qpage');
  // 模拟“刚才老师说的话”逐字出现
  const line = scene.transcript; let k = 0;
  const tick = () => { if (k <= line.length) { $('heard').textContent = line.slice(0, k++); timers.push(setTimeout(tick, 70)); } };
  timers.push(setTimeout(tick, 500));
}
$('toHome').onclick = () => { clearTimers(); show('home'); };

const frost = $('frost');
let r = 0, target = 0, px = 0, py = 0, pressing = false, raf = 0;

function loop(){
  r += (target - r) * 0.16;
  frost.style.setProperty('--r', r.toFixed(1) + 'px');
  frost.style.setProperty('--x', px + 'px');
  frost.style.setProperty('--y', py + 'px');

}

qp.addEventListener('pointerdown', e => {

});

};

/* 块：公式单独成块，文字在句读处断开（与 build/gen-asides.py 的 blocks() 逐字一致） */
const PUNCT_ONLY = /[\s。！？；：，、（）()“”"\-—]+/g;
function blocks(src){
  const out = [];
  for (const tok of src.match(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|[^$]+/g) || []) {
    if (tok.length > 1 && tok[0] === '$' && tok.endsWith('$')) { out.push(tok); continue; }
    for (const p of tok.match(/[^。！？；：，\n]*[。！？；：，\n]?/g) || []) if (p) out.push(p);
  }
  const res = [];
  for (const b of out) { if (res.length && !b.replace(PUNCT_ONLY, '')) res[res.length - 1] += b; else res.push(b); }
  return res;
}
function md(src){
  // 最小 Markdown：段落、无序列表、加粗；公式交给 KaTeX。每个块包一层 span.b，键（块原文 + 重复序号）记在 md.keys
  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const seen = {}, keys = [], srcs = []; md.keys = keys; md.srcs = srcs;
  const wrap = t => blocks(t).map(b => {
    const k0 = b.trim(); seen[k0] = (seen[k0] || 0) + 1; const k = seen[k0] === 1 ? k0 : k0 + '#' + seen[k0];
    keys.push(k); srcs.push(b);
    return `<span class="b" data-i="${keys.length - 1}">` + inline(esc(b)).replace(/\n/g, '<br>') + '</span>';
  }).join('');
  const paras = src.trim().split(/\n\s*\n/);
  return paras.map(b => {
    const lines = b.split('\n');
    if (/^\s*[\*\-]\s+/.test(lines[0])) {
      // 列表：以 * 或 - 开头的行起一项，其余行接到上一项后面
      const items = [];
      for (const l of lines) { if (/^\s*[\*\-]\s+/.test(l)) items.push(l.replace(/^\s*[\*\-]\s+/, '')); else items[items.length - 1] += '\n' + l.trim(); }
      return '<ul>' + items.map(t => '<li>' + wrap(t) + '</li>').join('') + '</ul>';
    }
    return '<p>' + wrap(b) + '</p>';
  }).join('');
  // 行内代码 `x` 在纸面上按普通文字显示（只去掉反引号，不改内容）
  function inline(t){ return t.replace(/`([^`\n]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
}
function renderMath(el){

  if (!P.active) { if (Math.hypot(e.clientX - P.x, e.clientY - P.y) > 8) { clearTimeout(P.timer); P.moved = true; P.tap = false; } return; }
  L.fx = e.clientX; L.fy = e.clientY; P.x = e.clientX; P.y = e.clientY;
}
function onUp(e){
  if (e.pointerId !== P.id) return;
  clearTimeout(P.timer);
  if (P.active) { P.active = false; asideRelease(e.clientX, e.clientY); return; }
  // 点按：卡片外 = 退一层；手动模式下点一个块 = 选它
  if (P.tap && performance.now() - P.startT < 400) {
    if (PICK) { const b = blockAt(e.clientX, e.clientY, $('answer')); if (b) pickBlock(b); else exitPick(); return; }
    if (!card.hidden && !card.contains(e.target) && C.stack.length) popLayer();
  }
}
function asideRelease(x, y){
  const inCard = P.src === card;
  const b = blockAt(x, y, P.within) || P.b;
  if (!b) { lensAway(); return; }
  const host = inCard ? b.closest('.pg') : $('answer');
  const key = host._keys[+b.dataset.i];
  const level = inCard ? C.stack.length + 1 : 1;
  const parentKey = inCard ? C.stack[0].key : null;
  const r = presetFor(level, key, parentKey);
  if (!r || !r.body) { lensBounce(); return; }
  const item = {key, level, span: r.span, body: r.body, readyAt: P.startT + 250 + replayWait(r)};
  if (!inCard) {
    C.stack = [item]; highlight($('answer'), r.span, +b.dataset.i);
    openCard(item, sentenceBottom(b), true);
  } else {
    item.pages = splitPages(item.body); C.stack.push(item); lensAway(); flip(() => renderLayer(item, false, Math.max(0, item.readyAt - performance.now())));
  }
}
document.addEventListener('pointerdown', onDown, true);
document.addEventListener('pointermove', onMove, true);
document.addEventListener('pointerup', onUp, true);
document.addEventListener('pointercancel', e => { if (e.pointerId === P.id) { clearTimeout(P.timer); if (P.active) { P.active = false; lensAway(); } } }, true);
document.addEventListener('touchmove', e => { if (P.active || DRAG.on) e.preventDefault(); }, {passive: false});
document.addEventListener('contextmenu', e => { if (e.target.closest('#apage, #card')) e.preventDefault(); });

/* ---- 卡片：上下拖动跟手，左右滑翻页 ---- */
const DRAG = {on: false, axis: '', x: 0, y: 0, top: 0, w: 0};
card.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  Object.assign(DRAG, {on: true, axis: '', x: e.clientX, y: e.clientY, top: parseFloat(card.style.top) || 0, w: card.querySelector('.viewport').offsetWidth});
  try { card.setPointerCapture(e.pointerId); } catch (_) {}
});
card.addEventListener('pointermove', e => {
  if (!DRAG.on || P.active) return;
  const dx = e.clientX - DRAG.x, dy = e.clientY - DRAG.y;
  if (!DRAG.axis && Math.hypot(dx, dy) > 7) { DRAG.axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x'; clearTimeout(P.timer); P.tap = false; }
  if (DRAG.axis === 'y') card.style.top = Math.min(Math.max(DRAG.top + dy, 8), innerHeight - 60) + 'px';
  if (DRAG.axis === 'x' && C.stack.length && C.stack[C.stack.length - 1].pages.length > 1) {
    track.style.transition = 'none'; track.style.transform = `translateX(${-C.page * DRAG.w + dx * (((C.page === 0 && dx > 0) || (C.page === 1 && dx < 0)) ? .3 : 1)}px)`;
  }
});
const endDrag = e => {
  if (!DRAG.on) return; DRAG.on = false;
  if (DRAG.axis === 'x' && C.stack.length) { const dx = e.clientX - DRAG.x, n = C.stack[C.stack.length - 1].pages.length;
    setPage(Math.max(0, Math.min(n - 1, C.page + (dx < -DRAG.w * .18 ? 1 : dx > DRAG.w * .18 ? -1 : 0))), true); }
};
card.addEventListener('pointerup', endDrag); card.addEventListener('pointercancel', endDrag);

/* ---- 猜错了：自己选（点一个块） ---- */
let PICK = false;
$('aim').onclick = e => {
  e.stopPropagation(); PICK = true; card.hidden = true; C.stack = []; clearHl();
  $('answer').querySelectorAll('.b').forEach(b => { if (b.textContent.trim()) b.classList.add('pick'); });
};
function exitPick(){ PICK = false; $('answer').querySelectorAll('.pick').forEach(b => b.classList.remove('pick')); }
function pickBlock(b){
  const key = $('answer')._keys[+b.dataset.i]; const r = presetFor(1, key, null, true); exitPick();
  if (!r || !r.body) return;
  const item = {key, level: 1, span: r.span, body: r.body, readyAt: performance.now() + replayWait(r)};
  C.stack = [item]; highlight($('answer'), r.span, +b.dataset.i);
  openCard(item, sentenceBottom(b), false);
}

/* ---- 调参面板：?tune=1 ---- */
if (/[?&#]tune=1/.test(location.search + location.hash)) {
  const box = document.createElement('div'); box.className = 'tune';
  const spec = [['zeta', '阻尼比 ζ', .4, 1.2, .01], ['resp', '响应 s', .1, .8, .01], ['zoom', '放大', 1, 2, .01], ['ca', '色差', 0, 1.5, .05], ['dist', '畸变', 0, 1.5, .05], ['blur', '模糊 px', 0, 10, .5], ['amber', '琥珀', .1, .8, .01]];
  box.innerHTML = spec.map(([k, n, a, b, s]) => `<label>${n}<input type="range" min="${a}" max="${b}" step="${s}" value="${TUNE[k]}" data-k="${k}"><span>${TUNE[k]}</span></label>`).join('');
  box.addEventListener('input', e => { const k = e.target.dataset.k; if (!k) return; TUNE[k] = +e.target.value; e.target.nextSibling.textContent = TUNE[k]; mapFor = ''; applyTune(); try { localStorage.setItem('suike-tune', JSON.stringify(TUNE)); } catch (_) {} });
  box.addEventListener('pointerdown', e => e.stopPropagation(), true);
  document.body.appendChild(box);
}

/* 截图检查用：#s=场景序号&v=press|answer[&old=1]|aside&b=块序号[&l=2][&m=1][&lens=1] */
(function(){
  const h = new URLSearchParams(location.hash.slice(1)); if (!h.has('s')) return;
  enterClass(+h.get('s'));
  if (h.get('v') === 'press') { const [cx, cy] = markCenter(); px = cx + 26; py = cy + 18; target = 128; r = 127; pressing = true; loop(); }
  if (h.get('v') === 'answer') { submit(); if (h.has('old')) setTimeout(() => $('showOld').click(), 9000); }
  if (h.get('v') === 'aside') addEventListener('load', () => {
    FAST = true; submit(); setTimeout(() => asideShot(h), 700);
  });
  function asideShot(h){
    const bi = +(h.get('b') || 0), b = $('answer').querySelector(`.b[data-i="${bi}"]`); if (!b) return;
    const rc = b.getClientRects()[0]; const x = rc.left + rc.width / 2, y = rc.top + rc.height / 2;
    if (h.has('lens')) { RMfix(); if (h.has('nofx')) { TUNE.ca = 0; TUNE.dist = 0; } lensStart($('apage'), x, y); L.p.x = 1; L.p.t = 1; return; }
    if (h.has('m')) { FAST = false; $('aim').onclick({stopPropagation(){}}); return; }
    FAST = true; P.src = $('apage'); P.within = $('answer'); P.b = b; P.startT = performance.now() - 5000; asideRelease(x, y);
    if (h.get('l') === '2') { const pb = $('pg0').querySelector('.b'); if (pb) { const r2 = pb.getClientRects()[0]; P.src = card; P.within = card; P.b = pb; asideRelease(r2.left + 2, r2.top + 2); } }
    FAST = false;
  }
})();
function RMfix(){ FAST = false; }
/* 自检：#selftest=1 用合成指针事件走一遍 长按→卡片→卡片内长按→点外退层→点外关闭，结果写进 document.title */
if (/selftest=1/.test(location.hash)) addEventListener('load', () => {
  enterClass(0); FAST = true; submit(); const out = [];
  const ev = (type, x, y, t) => (t || document.elementFromPoint(x, y) || document.body).dispatchEvent(new PointerEvent(type, {bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 7, pointerType: 'touch', isPrimary: true, button: 0}));
  const at = el => { const r = el.getClientRects()[0]; return [r.left + Math.min(r.width / 2, 20), r.top + r.height / 2]; };
  const seq = [];
  const T = (ms, f) => seq.push([ms, f]);
  T(800, () => { FAST = false; const b = $('answer').querySelectorAll('.b')[3]; const [x, y] = at(b); ev('pointerdown', x, y); T.p = [x, y]; });
  T(330, () => { out.push('lens:' + !lens.hidden); ev('pointerup', ...T.p); });
  T(2500, () => { out.push('card:' + !card.hidden, 'hl:' + document.querySelectorAll('#answer .hl').length, 'text:' + $('pg0').textContent.length, 'stack:' + C.stack.length); const pb = $('pg0').querySelector('.b'); const [x, y] = at(pb); ev('pointerdown', x, y); T.p = [x, y]; });
  T(330, () => ev('pointerup', ...T.p));
  T(2500, () => { out.push('nested:' + C.stack.length, 'text2:' + $('pg0').textContent.length); ev('pointerdown', 5, innerHeight - 5); });
  T(60, () => ev('pointerup', 5, innerHeight - 5));
  T(400, () => { out.push('pop:' + C.stack.length + '/' + !card.hidden); ev('pointerdown', 5, innerHeight - 5); });
  T(60, () => ev('pointerup', 5, innerHeight - 5));
  T(400, () => { out.push('closed:' + card.hidden + '/hl' + document.querySelectorAll('.hl').length); document.title = 'SELFTEST ' + out.join(' '); });
  let t = 0; for (const [ms, f] of seq) { t += ms; setTimeout(() => { try { f(); } catch (e) { document.title = 'SELFTEST ERR ' + e.message + ' ' + out.join(' '); } }, t); }
});
</script>
